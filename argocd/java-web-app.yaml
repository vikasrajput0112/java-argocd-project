apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-web-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vikasrajput0112/java-argocd-project.git
    targetRevision: main
    path: k8s/java-web-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

